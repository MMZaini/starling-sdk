  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/attachments":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listAttachments
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): attachment:read."
    post:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: uploadAttachment
      x-fern-retries:
        disabled: true
      description: "\n\nRequired scopes (any): attachment:write."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/spending-category":
    put:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: setSpendingCategory
      x-fern-retries:
        disabled: true
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nThe spending category is different. It specifies the type of spending associated with the transaction, for example, `GROCERIES`, `GIFTS` or `VAT`.\n\nRequired scopes (any): transaction:edit."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/receipt":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: getReceipt
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): receipt:read."
    put:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: putReceipt
      x-fern-retries:
        disabled: true
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): receipt:write, metadata:create, metadata:edit."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/attachments/{feedItemAttachmentUid}":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: downloadAttachment
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): attachment:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: get
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/mastercard":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: getMastercardDetails
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/receipts":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listReceipts
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): receipts:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listChanges
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nThe `changesSince` date must be within 1 year of the current date-time. Requests with a `changesSince` value older than 1 year will return HTTP 400. For queries spanning more than 1 year, use the paginated-transactions endpoint instead.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/transactions-between":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listBetween
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nThe date range between `minTransactionTimestamp` and `maxTransactionTimestamp` must not exceed 1 year. Requests exceeding this limit will return HTTP 400. For queries spanning more than 1 year, use the paginated-transactions endpoint instead.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/settled-transactions-between":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listSettledBetween
      description: "The date range between `minTransactionTimestamp` and `maxTransactionTimestamp` must not exceed 1 year. Requests exceeding this limit will return HTTP 400. For queries spanning more than 1 year, use the paginated-transactions endpoint instead.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/paginated-transactions":
    get:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: listPage
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nThis endpoint supports date ranges greater than 1 year and is the recommended alternative when querying more than 1 year of transaction history. The non-paginated feed endpoints (transactions-between, settled-transactions-between, and changesSince) are limited to a 1-year date range and will return HTTP 400 if exceeded.\n\nReturns transactions in descending order (most recent first), sorted by the time they were added to the feed. Page size is fixed at 1000 transactions. Follow pagination links in the links object to navigate pages. All transaction statuses are returned; filter on the client side if you only need settled transactions.\n\nRequired scopes (any): transaction:read."
  "/api/v2/feed/account/{accountUid}/category/{categoryUid}/{feedItemUid}/user-note":
    put:
      x-fern-sdk-group-name: feed
      x-fern-sdk-method-name: setNote
      x-fern-retries:
        disabled: true
      description: "Categories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): transaction:edit."
  "/api/v2/feed/account/{accountUid}/round-up":
