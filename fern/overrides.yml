# SDK naming and behavior, layered over the untouched upstream specification.
servers:
  - url: https://api-sandbox.starlingbank.com
    x-fern-server-name: Sandbox
  - url: https://api.starlingbank.com
    x-fern-server-name: Production
paths:
  "/api/v2/accounts/{accountUid}/feed-export":
    get:
      x-fern-sdk-group-name: accounts
      x-fern-sdk-method-name: exportFeed
      description: "A Feed Export contains a list of all (Settled) transactions on an account for a specified date range in CSV format.\n\nRequired scopes (any): feed-export-csv:read."
  "/api/v2/accounts/{accountUid}/balance":
    get:
      x-fern-sdk-group-name: accounts
      x-fern-sdk-method-name: getBalance
      description: "The account balance is expressed in two ways: cleared balance and effective balance.\n* The **cleared balance** is the balance of settled transactions and so does not include pending transactions. The cleared end of day balance is used to calculate interest.\n* The **effective balance** is the balance of settled and pending outgoing transactions. This is the balance most commonly presented to the account holder (e.g. in-app).\n\n`clearedBalance` and `effectiveBalance` hold the values for the main account only, excluding balances in spaces, savings goals etc. `totalClearedBalance` and `totalEffectiveBalance` hold the corresponding values totalled across the main account and all spaces, savings goals etc.\n\nMany payment types settle almost instantly (e.g. faster payments). Card transactions usually take a few days to settle and will remain pending for this time. We've got a blog post on [how card transactions work](https://www.starlingbank.com/blog/card-transactions-explained/).\n\nTo check whether the account has enough money to make a payment, use the confirmation of funds endpoint instead.\n\nRequired scopes (any): balance:read."
  "/api/v2/accounts/{accountUid}/identifiers":
    get:
      x-fern-sdk-group-name: accounts
      x-fern-sdk-method-name: getIdentifiers
      description: "Identifiers come in pairs:\n\n* A bank identifier, which identifies the bank\n* An account identifier, which identifiers the account at the bank\n\nIdentifiers can be:\n* Sort code and account number for domestic UK payments\n* BIC and IBAN for international payments\n* ABA and ACH routing numbers for domestic US payments\n\nRequired scopes (any): account-identifier:read."
  "/api/v2/accounts":
    get:
      x-fern-sdk-group-name: accounts
      x-fern-sdk-method-name: list
      description: "This endpoint returns a list of the accounts that you can access using the access token you supplied in the request header.\n\nEach access token is associated with a single account holder, who may have more than one account (for example, a GBP account and a euro account). This endpoint returns all the accounts that the account holder has given you permission to access.\n\nNote that an account holder in this context is either a personal account holder, or a sole trader account holder, or a business account holder or a joint account holder. An individual person may be more than one of these kinds of account holder, but each kind of account holder is a separate entity and hence requires a separate access token and permission.\n\nCategories are subdivisions of an account.\nThe default category holds the main balance and transactions. Savings goals and spending spaces are examples of other categories. You can use [`/api/v2/accounts`](#operations-tag-Accounts) to get the default category UID for an account.\n\nRequired scopes (any): account:read, account-list:read."
  "/api/v2/accounts/{accountUid}/confirmation-of-funds":
    get:
      x-fern-sdk-group-name: accounts
      x-fern-sdk-method-name: confirmFunds
      description: "\n\nRequired scopes (any): confirmation-of-funds:read."
  "/api/v2/account-holder/business":
    get:
      x-fern-sdk-group-name: business
      x-fern-sdk-method-name: get
      description: "\n\nRequired scopes (any): account:read."
  "/api/v2/account-holder/business/correspondence-address":
    get:
      x-fern-sdk-group-name: business
      x-fern-sdk-method-name: getCorrespondenceAddress
      description: "Will fallback to registered address if not available\n\nRequired scopes (any): address:read."
