[project]
name = "starling-bank-sdk"
version = "0.1.1"
description = "Typed Python client for the Starling Bank Public API"
readme = "README.md"
license = "MIT"
authors = [{name = "MMZaini"}]
requires-python = ">=3.11"
keywords = ["starling", "starling-bank", "banking", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.11,<3", "typing-extensions>=4.12"]

[project.urls]
Homepage = "https://github.com/MMZaini/starling-sdk"
Repository = "https://github.com/MMZaini/starling-sdk"
Issues = "https://github.com/MMZaini/starling-sdk/issues"

[project.optional-dependencies]
signing = ["cryptography>=44"]
dev = ["pytest>=8", "pytest-asyncio>=1", "build>=1.2", "twine>=6", "cryptography>=44"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starling_bank"]

[tool.hatch.build.targets.sdist]
include = ["src/starling_bank", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
