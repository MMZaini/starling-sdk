name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check for an automatic spec update
        type: string
        required: false

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install cryptography
      - run: npm --prefix sdks/typescript ci
      - run: npm --prefix sdks/typescript run typecheck
      - run: npm --prefix sdks/typescript test
      - run: npm --prefix sdks/typescript run build
      - run: npm --prefix sdks/typescript run check:public-types
      - run: npm --prefix sdks/typescript run check:scripts

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - run: python -m pip install -e 'sdks/python[dev]'
      - run: python -m pytest sdks/python/tests
      - run: python -m build sdks/python
      - run: python -m twine check sdks/python/dist/*

  react:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm --prefix sdks/typescript ci
      - run: npm --prefix sdks/typescript run build
      - run: npm --prefix packages/react ci
      - if: matrix.react == '18.3.1'
        run: npm --prefix packages/react install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
      - run: npm --prefix packages/react run typecheck
      - run: npm --prefix packages/react test
      - run: npm --prefix packages/react run build
      - run: npm --prefix packages/react run example:build
      - if: matrix.react == '19.3.0'
        working-directory: packages/react
        run: npx playwright install --with-deps chromium
      - if: matrix.react == '19.3.0'
        run: npm --prefix packages/react run test:browser

  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run generate
      - name: Check generated source and metadata
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm --prefix sdks/typescript ci
      - run: npm --prefix packages/react ci
      - run: python -m pip install build twine
      - run: npm run build:artifacts
      - run: npm run check:artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/
          if-no-files-found: error
