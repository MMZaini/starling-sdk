name: Generate SDKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: sdks/
          if-no-files-found: error
