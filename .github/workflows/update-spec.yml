name: Check upstream specification

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run spec:update
      - id: changes
        name: Compare with the committed snapshot
        run: |
          if git diff --quiet -- openapi/starling.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The upstream specification is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'The upstream specification changed. Review the update artifact and checks before committing it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm --prefix sdks/typescript ci
          python -m pip install -e 'sdks/python[dev]'
          npm run generate
          npm --prefix sdks/typescript run typecheck
          npm --prefix sdks/typescript test
          npm --prefix sdks/typescript run build
          npm --prefix sdks/typescript run check:public-types
          python -m pytest sdks/python/tests
      - if: always() && steps.changes.outputs.changed == 'true'
        name: Prepare a reviewable patch
        run: |
          mkdir -p artifacts/spec-update
          git add --intent-to-add openapi sdks docs/naming-map.md
          git diff --binary -- openapi sdks docs/naming-map.md > artifacts/spec-update/starling-spec-update.patch
      - if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starling-spec-update
          path: artifacts/spec-update/
          if-no-files-found: error
